<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <header>
        <div class="container header-wrap">
            <h1>寝室桶装水订购系统‑登录</h1>
            <div class="user-box">
                <button id="userCircleBtn" class="circle-btn">登录</button>
                <div id="userDropdown" class="dropdown-menu">
                    <a href="./profile.html">个人中心</a>
                    <button id="logoutBtn">登出</button>
                </div>
            </div>
        </div>
    </header>
    <nav>
        <div class="container">
            <a href="./index.html">首页</a>
            <a href="./create-order.html">订购</a>
        </div>
    </nav>
    <main class="container">
        <h2>用户登录</h2>
        <form>
            <div>
                <label for="username">用户名：</label>
                <input type="text" id="username">
            </div>
            <div>
                <label for="pwd">密码：</label>
                <input type="password" id="pwd">
            </div>
            <div>
                <button type="submit">登录</button>
            </div>
            <p>还没有账号？<a href="#">注册入口（占位）</a></p>
        </form>
    </main>

<div id="loginModal" class="modal-mask">
  <div class="modal-box">
    <div class="modal-tab">
      <button class="tab-btn active" data-tab="login">登录</button>
      <button class="tab-btn" data-tab="register">注册</button>
    </div>
    <div class="tab-content login-tab active">
      <div>
        <label>账号</label>
        <input type="text" id="loginAccount" placeholder="输入账号">
      </div>
      <div>
        <label>密码</label>
        <input type="password" id="loginPwd" placeholder="输入密码">
      </div>
      <div class="modal-buttons">
        <button id="loginSubmitBtn">登录</button>
        <button id="closeModalBtn">关闭</button>
      </div>
    </div>
    <div class="tab-content register-tab">
      <div>
        <label>设置账号</label>
        <input type="text" id="regAccount" placeholder="自定义账号">
      </div>
      <div>
        <label>设置密码</label>
        <input type="password" id="regPwd" placeholder="自定义密码">
      </div>
      <div class="modal-buttons">
        <button id="regSubmitBtn">注册</button>
        <button id="closeModalBtn2">关闭</button>
      </div>
    </div>
  </div>
</div>

    <footer>
        <p>寝室桶装水订购系统 ©2026</p>
    </footer>

<script>
let userData = JSON.parse(localStorage.getItem("userList")) || [];
let loginState = localStorage.getItem("isLogin");
const circleBtn = document.getElementById("userCircleBtn");
const dropdown = document.getElementById("userDropdown");
const modalMask = document.getElementById("loginModal");
const tabBtns = document.querySelectorAll(".tab-btn");
const loginTab = document.querySelector(".login-tab");
const regTab = document.querySelector(".register-tab");

function initUserState(){
  circleBtn.innerText = loginState === "true" ? "用户" : "登录";
}
initUserState();

tabBtns.forEach(btn=>{
  btn.onclick = ()=>{
    tabBtns.forEach(b=>b.classList.remove("active"));
    btn.classList.add("active");
    const tab = btn.dataset.tab;
    if(tab === "login"){
      loginTab.classList.add("active");regTab.classList.remove("active");
    }else{
      loginTab.classList.remove("active");regTab.classList.add("active");
    }
  }
})

circleBtn.onclick = function(){
  if(loginState === "true"){
    dropdown.classList.toggle("show");
  }else{
    modalMask.classList.add("show");
    tabBtns[0].click();
  }
}
document.querySelector("#closeModalBtn").onclick = ()=> modalMask.classList.remove("show");
document.querySelector("#closeModalBtn2").onclick = ()=> modalMask.classList.remove("show");

document.querySelector("#regSubmitBtn").onclick = function(){
  const acc = document.getElementById("regAccount").value.trim();
  const pwd = document.getElementById("regPwd").value.trim();
  if(!acc||!pwd){alert("账号密码不能为空");return;}
  if(userData.find(u=>u.account===acc)){alert("账号已存在！");return;}
  userData.push({account:acc,password:pwd});
  localStorage.setItem("userList",JSON.stringify(userData));
  alert("注册成功！请登录");
  tabBtns[0].click();
}

document.querySelector("#loginSubmitBtn").onclick = function(){
  const acc = document.getElementById("loginAccount").value.trim();
  const pwd = document.getElementById("loginPwd").value.trim();
  const user = userData.find(u=>u.account===acc && u.password===pwd);
  if(user){
    alert("登录成功！");
    localStorage.setItem("isLogin","true");
    localStorage.setItem("currentUser", acc);
    loginState="true";
    circleBtn.innerText="用户";
    modalMask.classList.remove("show");
  }else{
    alert("账号或密码错误");
  }
}

document.getElementById("logoutBtn").onclick = function(){
  localStorage.removeItem("isLogin");
  localStorage.removeItem("currentUser");
  loginState=null;
  circleBtn.innerText="登录";
  dropdown.classList.remove("show");
}

document.addEventListener("click",function(e){
  if(!circleBtn.contains(e.target) && !dropdown.contains(e.target)){
    dropdown.classList.remove("show");
  }
})
</script>
</body>
</html>
