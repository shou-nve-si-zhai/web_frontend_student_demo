<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>创建订水订单</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <header>
        <div class="container header-wrap">
            <h1>寝室桶装水订购系统</h1>
            <div class="user-box">
                <button id="userCircleBtn" class="circle-btn">登录</button>
                <div id="userDropdown" class="dropdown-menu">
                    <a href="./profile.html">个人中心</a>
                    <button id="logoutBtn">登出</button>
                </div>
            </div>
        </div>
    </header>
    <nav>
        <div class="container">
            <a href="./index.html">首页</a>
            <a href="./create-order.html">订购</a>
        </div>
    </nav>
    <main class="container">
        <h2 style="text-align:center; border-left:none; padding-left:0;">新建桶装水订购订单</h2>
        <form id="orderForm" style="margin: 0 auto;">
            <div>
                <label for="water-type">水品类：</label>
                <select id="water-type">
                    <option value="" selected disabled>请选择水品类</option>
                    <option value="wahaha-16.8" data-price="15">娃哈哈‑16.8L桶装水｜15元</option>
                    <option value="nongfu-19-student" data-price="17">农夫山泉‑19.0L桶装水(学生特惠)｜17元</option>
                    <option value="c'estbon-18.9" data-price="18">怡宝‑18.9L桶装水｜18元</option>
                    <option value="c'estbon-12.8" data-price="12">怡宝‑12.8L一次性桶装水｜12元（免押金）</option>
                    <option value="nongfu-19-once" data-price="19">农夫山泉‑19.0L一次性桶装水｜19元（免押金）</option>
                </select>
            </div>
            <div>
                <label for="bucket-count">订购桶数：</label>
                <input type="number" id="bucket-count" min="1" placeholder="请输入桶数">
            </div>
            <div>
                <label>订单总价：</label>
                <input type="text" id="total-price" value="" readonly placeholder="选择商品后自动计算" style="background-color:#f3f4f6; font-weight:600; color: var(--color-price);">
            </div>
            <div>
                <label for="building">楼栋号：</label>
                <input type="text" id="building">
            </div>
            <div>
                <label for="room">寝室号：</label>
                <input type="text" id="room">
            </div>
            <div>
                <label for="remark">备注信息：</label>
                <textarea id="remark"></textarea>
            </div>

            <h3>下单流程</h3>
            <ol>
                <li>选择桶装水品类与订购桶数</li>
                <li>填写寝室楼栋、寝室号配送地址</li>
                <li>填写备注特殊配送要求</li>
                <li>提交订单，等待水站接单配送</li>
            </ol>

            <div>
                <button type="submit">提交订单</button>
                <button type="reset">清空</button>
                <a href="./index.html"><button type="button">取消，返回商品列表</button></a>
            </div>
        </form>
    </main>

<div id="loginModal" class="modal-mask">
  <div class="modal-box">
    <div class="modal-tab">
      <button class="tab-btn active" data-tab="login">登录</button>
      <button class="tab-btn" data-tab="register">注册</button>
    </div>
    <div class="tab-content login-tab active">
      <div>
        <label>账号</label>
        <input type="text" id="loginAccount" placeholder="输入账号">
      </div>
      <div>
        <label>密码</label>
        <input type="password" id="loginPwd" placeholder="输入密码">
      </div>
      <div class="modal-buttons">
        <button id="loginSubmitBtn">登录</button>
        <button id="closeModalBtn">关闭</button>
      </div>
    </div>
    <div class="tab-content register-tab">
      <div>
        <label>设置账号</label>
        <input type="text" id="regAccount" placeholder="自定义账号">
      </div>
      <div>
        <label>设置密码</label>
        <input type="password" id="regPwd" placeholder="自定义密码">
      </div>
      <div class="modal-buttons">
        <button id="regSubmitBtn">注册</button>
        <button id="closeModalBtn2">关闭</button>
      </div>
    </div>
  </div>
</div>

    <footer>
        <p>寝室桶装水订购系统 ©2026</p>
    </footer>

<script>
let userData = JSON.parse(localStorage.getItem("userList")) || [];
let loginState = localStorage.getItem("isLogin");
const circleBtn = document.getElementById("userCircleBtn");
const dropdown = document.getElementById("userDropdown");
const modalMask = document.getElementById("loginModal");
const tabBtns = document.querySelectorAll(".tab-btn");
const loginTab = document.querySelector(".login-tab");
const regTab = document.querySelector(".register-tab");

function initUserState(){
  circleBtn.innerText = loginState === "true" ? "用户" : "登录";
}
initUserState();

tabBtns.forEach(btn=>{
  btn.onclick = ()=>{
    tabBtns.forEach(b=>b.classList.remove("active"));
    btn.classList.add("active");
    const tab = btn.dataset.tab;
    if(tab === "login"){
      loginTab.classList.add("active");regTab.classList.remove("active");
    }else{
      loginTab.classList.remove("active");regTab.classList.add("active");
    }
  }
})

circleBtn.onclick = function(){
  if(loginState === "true"){
    dropdown.classList.toggle("show");
  }else{
    modalMask.classList.add("show");
    tabBtns[0].click();
  }
}
document.querySelector("#closeModalBtn").onclick = ()=> modalMask.classList.remove("show");
document.querySelector("#closeModalBtn2").onclick = ()=> modalMask.classList.remove("show");

document.querySelector("#regSubmitBtn").onclick = function(){
  const acc = document.getElementById("regAccount").value.trim();
  const pwd = document.getElementById("regPwd").value.trim();
  if(!acc||!pwd){alert("账号密码不能为空");return;}
  if(userData.find(u=>u.account===acc)){alert("账号已存在！");return;}
  userData.push({account:acc,password:pwd});
  localStorage.setItem("userList",JSON.stringify(userData));
  alert("注册成功！请登录");
  tabBtns[0].click();
}

document.querySelector("#loginSubmitBtn").onclick = function(){
  const acc = document.getElementById("loginAccount").value.trim();
  const pwd = document.getElementById("loginPwd").value.trim();
  const user = userData.find(u=>u.account===acc && u.password===pwd);
  if(user){
    alert("登录成功！");
    localStorage.setItem("isLogin","true");
    localStorage.setItem("currentUser", acc);
    loginState="true";
    circleBtn.innerText="用户";
    modalMask.classList.remove("show");
  }else{
    alert("账号或密码错误");
  }
}

document.getElementById("logoutBtn").onclick = function(){
  localStorage.removeItem("isLogin");
  localStorage.removeItem("currentUser");
  loginState=null;
  circleBtn.innerText="登录";
  dropdown.classList.remove("show");
}

document.addEventListener("click",function(e){
  if(!circleBtn.contains(e.target) && !dropdown.contains(e.target)){
    dropdown.classList.remove("show");
  }
})

// 价格自动计算
function calcPrice(){
  const sel = document.getElementById("water-type");
  const countInput = document.getElementById("bucket-count");
  const priceInput = document.getElementById("total-price");
  if(!sel.value || !countInput.value){
    priceInput.value = "";
    return null;
  }
  const price = parseFloat(sel.options[sel.selectedIndex].dataset.price) || 0;
  const count = parseInt(countInput.value) || 0;
  const total = (price * count).toFixed(2);
  priceInput.value = total + "元";
  return total;
}
document.getElementById("water-type").addEventListener("change", calcPrice);
document.getElementById("bucket-count").addEventListener("input", calcPrice);

// 提交订单：保存到当前账号的订单列表
document.getElementById("orderForm").addEventListener("submit", function(e){
  e.preventDefault();
  if(loginState !== "true"){
    alert("请先登录后再下单！");
    modalMask.classList.add("show");
    tabBtns[0].click();
    return;
  }
  const waterType = document.getElementById("water-type");
  if(!waterType.value){ alert("请选择水品类"); return; }
  const waterName = waterType.options[waterType.selectedIndex].text.split("｜")[0];
  const count = document.getElementById("bucket-count").value.trim();
  const building = document.getElementById("building").value.trim();
  const room = document.getElementById("room").value.trim();
  if(!count || count < 1){ alert("请输入有效的订购桶数"); return; }
  if(!building || !room){ alert("请填写楼栋号和寝室号"); return; }

  const price = calcPrice();
  if(price === null){ alert("请确认商品和桶数后再提交"); return; }
  const currentUser = localStorage.getItem("currentUser");
  const orderKey = "orders_" + currentUser;
  let orders = JSON.parse(localStorage.getItem(orderKey)) || [];
  const order = {
    id: Date.now(),
    water: waterName,
    count: count,
    price: price,
    building: building,
    room: room,
    remark: document.getElementById("remark").value.trim(),
    status: "待接单",
    time: new Date().toLocaleDateString()
  };
  orders.unshift(order);
  localStorage.setItem(orderKey, JSON.stringify(orders));
  alert("订单提交成功！可在个人中心查看。");
  document.getElementById("orderForm").reset();
  calcPrice();
})
</script>
</body>
</html>
